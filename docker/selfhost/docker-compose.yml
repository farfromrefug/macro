# Macro, self-hosted: the web app, the core backend services and their
# infrastructure, started from published images.
#
#   cd docker/selfhost
#   ./setup.sh              # creates .env with generated secrets
#   docker compose up -d
#
# Then open PUBLIC_ORIGIN (https://localhost:8090 by default). Sign in with any
# email address: the one-time code arrives in Mailpit, at PUBLIC_ORIGIN/mailpit,
# until SMTP_HOST points at a real mail server. See README.md.
#
# This is the same service set `just run_local` runs (docker/docker-compose.yml
# plus the xtask-generated override), minus the WhatsApp and Slack workers, the
# AI editing worker and the Gmail/Outlook/model emulators. AWS is stood in for by
# LocalStack, as it is locally: the services have no other storage or queue
# backend.
name: macro-selfhost

# Configuration shared by every Rust service. Static values mirror
# tooling/xtask/crates/xtask_local/src/local/local_env.rs (the local stack's
# env); anything secret or specific to this deployment comes from .env.
x-macro-env: &macro-env
  ENVIRONMENT: local
  PORT: "8080"
  RUST_MIN_STACK: "67108864"

  # Where the browser reaches this stack.
  APP_BASE_URL: ${PUBLIC_ORIGIN}
  FRONTEND_ORIGIN: ${PUBLIC_ORIGIN}
  PIPEDREAM_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
  OVERRIDE_APP_SERVICE_URL: ${PUBLIC_ORIGIN}
  OVERRIDE_API_GATEWAY_URL: ${PUBLIC_ORIGIN}
  OVERRIDE_COGNITION_PUBLIC_URL: ${PUBLIC_ORIGIN}/cognition
  OVERRIDE_MCP_PUBLIC_URL: ${PUBLIC_ORIGIN}/mcp
  OVERRIDE_STATIC_FILE_PUBLIC_URL: ${PUBLIC_ORIGIN}/static-file
  LOCAL_AWS_PUBLIC_URL: ${PUBLIC_ORIGIN}/local-storage
  DOCUMENT_STORAGE_SERVICE_CLOUDFRONT_DISTRIBUTION_URL: ${PUBLIC_ORIGIN}/local-storage/doc-storage
  EMAIL_SERVICE_CLOUDFRONT_DISTRIBUTION_URL: ${PUBLIC_ORIGIN}/local-storage/macro-email-attachments
  BASE_URL: ${PUBLIC_ORIGIN}/auth
  GITHUB_SYNC_APP_URL: ${PUBLIC_ORIGIN}

  # Infrastructure.
  DATABASE_URL: &database-url postgres://${POSTGRES_USER:-macro}:${POSTGRES_PASSWORD}@postgres:5432/macrodb
  DATABASE_URL_READONLY: *database-url
  MACRO_DB_URL: *database-url
  REDIS_URI: redis://redis:6379
  REDIS_HOST: redis://redis:6379
  DOCUMENT_STORAGE_SERVICE_REDIS_URI: redis://redis:6379
  LAST_ONLINE_REDIS_URI: redis://redis:6379
  OPENSEARCH_URL: http://search:9200
  OPENSEARCH_USERNAME: macrouser
  OPENSEARCH_PASSWORD: local
  KAFKA_BROKERS: kafka:29092
  LOCAL_AWS_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SENDER_BASE_ADDRESS: ${MAIL_FROM_DOMAIN:-macro.local}

  # Service-to-service addresses.
  OVERRIDE_AUTH_SERVICE_URL: http://authentication-service:8080
  OVERRIDE_CALENDAR_SERVICE_URL: http://calendar-service:8080
  OVERRIDE_CONNECTION_GATEWAY_URL: http://connection-gateway:8080
  OVERRIDE_CONNECTION_GATEWAY_WEBSOCKET_URL: ws://connection-gateway:8080
  OVERRIDE_CONTACTS_SERVICE_URL: http://contacts-service:8080
  OVERRIDE_DOCUMENT_STORAGE_SERVICE_URL: http://document-storage-service:8080
  OVERRIDE_EMAIL_SERVICE_URL: http://email-service:8080
  OVERRIDE_LEXICAL_SERVICE_URL: http://lexical-service:8096
  OVERRIDE_NOTIFICATION_SERVICE_URL: http://notification-service:8080
  OVERRIDE_SEARCH_PROCESSING_SERVICE_URL: http://search-processing-service:8080
  OVERRIDE_STATIC_FILE_SERVICE_URL: http://static-file-service:8080
  OVERRIDE_SYNC_SERVICE_URL: http://sync-service:8787
  OVERRIDE_UNFURL_SERVICE_URL: http://unfurl-service:8080
  # The agent harness, and the AI editing worker, which this stack does not run
  # (a feature that calls it fails instead of reaching a service).
  OVERRIDE_AGENT_GIT_SERVICE_URL: http://agent-harness-service:8080/agent-git
  OVERRIDE_AGENT_HARNESS_SERVICE_URL: http://agent-harness-service:8080
  OVERRIDE_AGENT_HARNESS_EGRESS_URL: http://agent-harness-service:8102
  OVERRIDE_AI_EDITING_WORKER_URL: http://ai-editing-worker:8933
  OVERRIDE_DOCUMENT_COGNITION_SERVICE_URL: http://agent-harness-service:8080/cognition
  OVERRIDE_MCP_SERVICE_URL: http://agent-harness-service:8080
  OVERRIDE_PREVIEW_GATEWAY_URL: http://agent-harness-service:8080/preview
  OVERRIDE_SCHEDULED_ACTION_SERVICE_URL: http://agent-harness-service:8080/scheduled-action
  EXTERNAL_EGRESS_BASE_URL: http://agent-harness-service:8102

  # Shared secrets (generated into .env by setup.sh).
  INTERNAL_API_SECRET_KEY: ${INTERNAL_API_SECRET_KEY}
  INTERNAL_API_KEY: ${INTERNAL_API_SECRET_KEY}
  INTERNAL_AUTH_KEY: ${INTERNAL_API_SECRET_KEY}
  AUTHENTICATION_SERVICE_SECRET_KEY: ${INTERNAL_API_SECRET_KEY}
  SYNC_SERVICE_AUTH_KEY: ${INTERNAL_API_SECRET_KEY}
  SERVICE_INTERNAL_AUTH_KEY: ${INTERNAL_API_SECRET_KEY}
  DOCUMENT_STORAGE_SERVICE_AUTH_KEY: ${INTERNAL_API_SECRET_KEY}
  DOCUMENT_PERMISSION_JWT: ${DOCUMENT_PERMISSION_SECRET}
  INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET}
  URL_SIGNING_HMAC: ${URL_SIGNING_HMAC}

  # Identity (FusionAuth). The ids are fixed: they are baked into the kickstart

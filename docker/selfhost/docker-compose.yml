  DAYTONA_API_KEY: ""
  DAYTONA_SNAPSHOT: macro-agent-harness
  DEV_DANGEROUS_LOCAL_CONTAINERS: "false"
  PREVIEW_DOMAIN: preview.localhost
  PREVIEW_SSH_HOST: localhost
  PREVIEW_SSH_HOST_KEY: ${PREVIEW_SSH_HOST_KEY}
  PREVIEW_SSH_PROXY_HOST: ""
  PREVIEW_SSH_PUBLIC_PORT: "2222"
  PREVIEW_HTTPS_PORT: "8443"
  COMPUTERS_AGENT_EFFECTS: "false"

x-service: &service
  image: ${MACRO_REGISTRY:-ghcr.io/macro-inc}/macro-services:${MACRO_VERSION:-latest}
  restart: unless-stopped
  environment: *macro-env
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # --- Infrastructure -------------------------------------------------------

  postgres:
    # pgvector: the migrations create the `vector` extension.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # The default 100 connections is exhausted when every service's pool fills
    # under load, e.g. a large mailbox backfill. pg_stat_statements is installed
    # by a migration and has to be preloaded.
    command: postgres -c max_connections=500 -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-macro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: macrodb
    volumes:
      # pg18 images keep PGDATA in a version-specific subdirectory; mount the
      # parent so it lands inside the volume (docker-library/postgres#1259).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-macro} -d macrodb"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Single-node KRaft: this node is both broker and controller.
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      # The image defaults to a 1 GB heap, far more than one idle node uses.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms128m -Xmx384m}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # One node needs one offsets partition (the default is 50), and small
      # indexes: Kafka pre-allocates 10 MB of index file per partition.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 262144
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # A fixed cluster id lets the data volume survive container recreation.
      CLUSTER_ID: TWFjcm9Mb2NhbEthZmthMQ
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  kafka-topics:
    # Creates the declared event topics (.github/kafka-cluster-topics.json).
    image: apache/kafka:3.9.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-topics.txt:/topics.txt:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while read -r topic; do
          [ -n "$$topic" ] || continue
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions "${KAFKA_PARTITIONS:-1}" --replication-factor 1
        done < /topics.txt

  search:
    # OpenSearch with the analysis-icu plugin the channels index mapping needs.
    image: ${MACRO_REGISTRY:-ghcr.io/macro-inc}/macro-opensearch:${MACRO_VERSION:-latest}
    build:
      context: ../../infra/local/opensearch
    restart: unless-stopped
    environment:
      cluster.name: search
      discovery.type: single-node
      node.name: search
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms256m -Xmx256m -XX:-UseG1GC -XX:+UseSerialGC -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=64m -Xss512k}
      # Without the security plugin there is no security to disable.
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: curl --fail --silent --output /dev/null http://localhost:9200/
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 40s

  localstack:
    # AWS stand-in for SQS, S3, DynamoDB and KMS. The 4.x line is the last that
    # runs without an account token.
    image: localstack/localstack:4
    restart: unless-stopped
    environment:
      SERVICES: sqs,s3,dynamodb,kms
      DEFAULT_REGION: us-east-1
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE:-1}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/provision.sh:/etc/localstack/init/ready.d/provision.sh:ro
    healthcheck:
      # `ready` also waits for the init scripts, i.e. the queues and buckets.
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  mailpit:
    # Catches outgoing mail, including sign-in codes. Replace by pointing
    # SMTP_HOST at a real mail server.
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mailpit
      MP_MAX_MESSAGES: "5000"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Identity -----------------------------------------------------------------

  fusionauth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FUSIONAUTH_DB_PASSWORD}
    volumes:
      - fusionauth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  fusionauth-kickstart:
    # Renders the file FusionAuth applies on its first boot (signing key, tenant,
    # the Macro application, admin user, webhooks).
    image: ${MACRO_REGISTRY:-ghcr.io/macro-inc}/macro-bootstrap:${MACRO_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.selfhost-bootstrap
    restart: "no"
    command: ["macro-render-kickstart", "/kickstart/kickstart.json"]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_PUBLIC_URL: ${PUBLIC_ORIGIN}/auth
      FUSIONAUTH_API_KEY: ${FUSIONAUTH_API_KEY}
      FUSIONAUTH_CLIENT_SECRET: ${FUSIONAUTH_CLIENT_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      INTERNAL_API_SECRET_KEY: ${INTERNAL_API_SECRET_KEY}
      ADMIN_EMAIL: ${FUSIONAUTH_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${FUSIONAUTH_ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-NONE}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@macro.local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-client-secret}
    volumes:
      - fusionauth_kickstart:/kickstart

  fusionauth:
    image: fusionauth/fusionauth-app:1.62.1
    restart: unless-stopped
    init: true
    depends_on:
      fusionauth-db:
        condition: service_healthy
      fusionauth-kickstart:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:postgresql://fusionauth-db:5432/fusionauth
      DATABASE_ROOT_USERNAME: postgres
      DATABASE_ROOT_PASSWORD: ${FUSIONAUTH_DB_PASSWORD}
      DATABASE_USERNAME: fusionauth
      DATABASE_PASSWORD: ${FUSIONAUTH_DB_PASSWORD}
      FUSIONAUTH_APP_KICKSTART_FILE: /usr/local/fusionauth/kickstart/kickstart.json
      FUSIONAUTH_APP_MEMORY: ${FUSIONAUTH_MEMORY:-320M}
      FUSIONAUTH_APP_RUNTIME_MODE: production
      FUSIONAUTH_APP_URL: http://fusionauth:9011
    ports:
      # The admin UI. Loopback only: it is not part of the proxied origin.
      - "127.0.0.1:${FUSIONAUTH_PORT:-9011}:9011"
    volumes:
      - fusionauth_config:/usr/local/fusionauth/config
      - fusionauth_kickstart:/usr/local/fusionauth/kickstart:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s --max-time 4 http://localhost:9011/api/status | grep -q '\"status\":\"Ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # --- One-shot setup ---------------------------------------------------------------

  migrate:
    image: ${MACRO_REGISTRY:-ghcr.io/macro-inc}/macro-bootstrap:${MACRO_VERSION:-latest}
    restart: "no"
    command: ["macro-migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  create-indices:
    image: ${MACRO_REGISTRY:-ghcr.io/macro-inc}/macro-bootstrap:${MACRO_VERSION:-latest}
    restart: "no"
    command: ["macro-create-indices"]
    environment:
      OPENSEARCH_URL: http://search:9200
    depends_on:
      search:
        condition: service_healthy

  # --- Backend services ---------------------------------------------------------------

  authentication-service:
    <<: *service
    command: ["/app/out/authentication_service"]
    depends_on: &base-depends
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      fusionauth:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  connection-gateway:
    <<: *service
    command: ["/app/out/connection_gateway_service"]
    depends_on: *base-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  contacts-service:
    <<: *service
    command: ["/app/out/contacts_service"]
    depends_on: *base-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  document-storage-service:
    <<: *service
    command: ["/app/out/document_storage_service"]
    networks:
      default:
        aliases:
          # The sync worker's wrangler.docker.toml dials DSS by this name.
          - document_storage_service
    depends_on:
      <<: *base-depends
      authentication-service:
        condition: service_healthy
      connection-gateway:
        condition: service_healthy
      sync-service:
        condition: service_healthy
      lexical-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  document-upload-finalizer:
    # LocalStack S3 ObjectCreated -> SQS consumer. Production runs the
    # document_upload_finalizer_handler Lambda instead.
    <<: *service
    command: ["/app/out/document_upload_finalizer_local_worker"]
    depends_on:
      <<: *base-depends
      sync-service:
        condition: service_healthy
      lexical-service:
        condition: service_healthy

  email-service:
    <<: *service
    command: ["/app/out/email_service"]
    depends_on:
      <<: *base-depends
      authentication-service:
        condition: service_healthy
      connection-gateway:
        condition: service_healthy
      document-storage-service:
        condition: service_healthy
      static-file-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  email-pubsub-workers:
    <<: *service
    command: ["/app/out/pubsub_workers"]
    depends_on:
      <<: *base-depends
      email-service:
        condition: service_healthy

  calendar-service:
    <<: *service
    command: ["/app/out/calendar_service"]
    depends_on:
      <<: *base-depends
      authentication-service:
        condition: service_healthy
      connection-gateway:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  notification-service:
    <<: *service
    command: ["/app/out/notification_service"]
    depends_on:
      <<: *base-depends
      authentication-service:
        condition: service_healthy
      connection-gateway:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  search-processing-service:
    <<: *service
    command: ["/app/out/search_processing_service"]
    depends_on:
      <<: *base-depends
      create-indices:
        condition: service_completed_successfully
      search:
        condition: service_healthy
      lexical-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  agent-harness-service:
    # The assistant, agent sessions, connectors and scheduled actions. The web
    # app calls it on every page load, so the app does not work without it.
    <<: *service
    command: ["/app/out/agent_harness_service"]
    volumes:
      - agent_git_repos:/data/agent-git
    depends_on:
      <<: *base-depends
      connection-gateway:
        condition: service_healthy
      lexical-service:
        condition: service_healthy
      sync-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  static-file-service:
    <<: *service
    command: ["/app/out/static_file_service"]
    depends_on: *base-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/health"]

  unfurl-service:
    <<: *service
    command: ["/app/out/unfurl_service"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  image-proxy-service:
    <<: *service
    command: ["/app/out/image_proxy_service"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]

  # --- Workers (Cloudflare Workers and Bun, run locally) -----------------------------------

  sync-service:
    # The document sync worker: wrangler runs it on workerd, with its Durable
    # Object, KV and D1 state in /app/.wrangler/state.
    image: ${MACRO_REGISTRY:-ghcr.io/macro-inc}/macro-sync-service:${MACRO_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/sync-service.Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_SECRET_KEY: ${INTERNAL_API_SECRET_KEY}
      DOCUMENT_PERMISSIONS_SECRET: ${DOCUMENT_PERMISSION_SECRET}
      DSS_INTERNAL_AUTH_KEY: ${INTERNAL_API_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    volumes:
      - sync_state:/app/.wrangler/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  lexical-service:
    image: ${MACRO_REGISTRY:-ghcr.io/macro-inc}/macro-lexical-service:${MACRO_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.selfhost-lexical
    restart: unless-stopped
    environment:
      PORT: "8096"
      INTERNAL_AUTH_KEY: ${INTERNAL_API_SECRET_KEY}
      SYNC_SERVICE_AUTH_KEY: ${INTERNAL_API_SECRET_KEY}
      SYNC_SERVICE_URL: http://sync-service:8787
    depends_on:
      sync-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8096/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s

  websocket-service:
    # A small WebSocket endpoint the app connects to at /websocket.
    image: ${MACRO_REGISTRY:-ghcr.io/macro-inc}/macro-websocket-service:${MACRO_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.selfhost-websocket
    restart: unless-stopped

  livekit:
    # Video calls: a LiveKit SFU. Optional (profile `calls`); enable it with
    # ./setup.sh --calls. The backend uses one URL, LIVEKIT_SERVER_URL, both to
    # call LiveKit's API from inside the network and to hand the browser, so the
    # hostname in it has to resolve in both places. The service answers to that
    # name on the compose network, and the browser resolves `*.localhost` itself.
    image: livekit/livekit-server:v1.9.0
    profiles: [calls]
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        keys:
          ${LIVEKIT_API_KEY:-local-livekit-key}: ${LIVEKIT_API_SECRET:-local-livekit-secret}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-local-livekit-key}
          urls:
            - http://document-storage-service:8080/call/webhook
    ports:
      - "${LIVEKIT_BIND:-127.0.0.1}:7880:7880"
      - "${LIVEKIT_BIND:-127.0.0.1}:7881:7881"
      - "${LIVEKIT_BIND:-127.0.0.1}:7882:7882/udp"
    networks:
      default:
        aliases:
          - ${LIVEKIT_HOST:-livekit.localhost}

  # --- Edge ------------------------------------------------------------------------------

  proxy:
    # Caddy: serves the web app and routes every backend path (Caddyfile).
    image: ${MACRO_REGISTRY:-ghcr.io/macro-inc}/macro-web:${MACRO_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile.selfhost-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost:8090}
      TLS_MODE: ${TLS_MODE:-internal}
    ports:
      - "${PROXY_PORT:-8090}:${PROXY_PORT:-8090}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      authentication-service:
        condition: service_healthy
      document-storage-service:
        condition: service_healthy
      agent-harness-service:
        condition: service_healthy
      websocket-service:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  localstack_data:
  mailpit_data:
  fusionauth_db_data:
  fusionauth_config:
  fusionauth_kickstart:
  sync_state:
  agent_git_repos:
  caddy_data:
  caddy_config:

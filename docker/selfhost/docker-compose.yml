  FUSIONAUTH_PUBLIC_URL: http://localhost:${FUSIONAUTH_PORT:-9011}
  FUSIONAUTH_API_KEY: ${FUSIONAUTH_API_KEY}
  FUSIONAUTH_API_KEY_SECRET_KEY: ${FUSIONAUTH_API_KEY}
  FUSIONAUTH_CLIENT_ID: 22222222-2222-4222-8222-222222222222
  FUSIONAUTH_CLIENT_SECRET_KEY: ${FUSIONAUTH_CLIENT_SECRET}
  FUSIONAUTH_OAUTH_REDIRECT_URI: ${PUBLIC_ORIGIN}/auth/oauth/redirect
  AUDIENCE: 22222222-2222-4222-8222-222222222222
  ISSUER: local.macro.com
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  MACRO_API_TOKEN_ISSUER: local
  MACRO_API_TOKEN_EXPIRY_SECONDS: "3600"
  MACRO_API_TOKEN_PUBLIC_KEY: ${MACRO_API_TOKEN_PUBLIC_KEY}
  MACRO_API_TOKEN_PRIVATE_SECRET_KEY: ${MACRO_API_TOKEN_PRIVATE_KEY}
  EMAIL_SERVICE_CLOUDFRONT_SIGNER_PRIVATE_KEY: ${ATTACHMENT_LINK_SIGNING_KEY}
  EMAIL_SERVICE_CLOUDFRONT_SIGNER_PUBLIC_KEY_ID: macro-selfhost-signer
  DOCUMENT_STORAGE_SERVICE_CLOUDFRONT_SIGNER_PUBLIC_KEY_ID: macro-selfhost-signer
  DOCUMENT_STORAGE_SERVICE_CLOUDFRONT_SIGNER_PRIVATE_KEY: local
  DOCUMENT_STORAGE_SERVICE_CLOUDFRONT_SIGNER_PRIVATE_KEY_SECRET_NAME: local-cloudfront-signer-private-key
  ACCOUNT_LINK_STATE_SECRET: ${APP_SECRET}
  GITHUB_INSTALLATION_STATE_SECRET: ${APP_SECRET}
  GITHUB_WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET}
  CAL_WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET}
  STRIPE_WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET}
  PIPEDREAM_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
  PIPEDREAM_WEBHOOK_URI: http://agent-harness-service:8080/pipedream/mcp/webhook?secret=${WEBHOOK_SECRET}
  MCP_CREDENTIALS_KEY_SECRET_NAME: ${MCP_CREDENTIALS_KEY}

  # AWS resources (created by localstack/provision.sh).
  ATTACHMENT_BUCKET: macro-email-attachments
  DOCUMENT_STORAGE_BUCKET: doc-storage
  DOCX_DOCUMENT_UPLOAD_BUCKET: docx-upload
  STATIC_STORAGE_BUCKET: static-file-storage
  UPLOAD_STAGING_BUCKET: bulk-upload-staging
  CALL_RECORDING_BUCKET_NAME: macro-call-recording-local
  AGENT_SESSION_CHANGES_BUCKET: agent-session-changes
  GITHUB_PULL_REQUEST_PATCH_BUCKET: github-pull-request-patches
  BULK_UPLOAD_REQUESTS_TABLE: bulk-upload
  CONNECTION_GATEWAY_TABLE: connection-gateway-table
  STATIC_FILE_SERVICE_DYNAMODB_TABLE_NAME: static-file-metadata
  BACKFILL_JOBS_TABLE: search-processing-backfill-jobs
  NOTIFICATION_QUEUE: http://localstack:4566/000000000000/notification-queue
  NOTIFICATION_INGRESS_QUEUE: http://localstack:4566/000000000000/notification-ingress-queue
  PUSH_NOTIFICATION_EVENT_HANDLER_QUEUE: push-delivery-queue
  OVERRIDE_WEBHOOK_EVENT_QUEUE: http://localstack:4566/000000000000/webhook-event-queue.fifo
  BACKFILL_QUEUE: email-service-backfill-queue
  EMAIL_BACKFILL_QUEUE: http://localstack:4566/000000000000/email-service-backfill-queue
  OVERRIDE_EMAIL_CRM_CLEANUP_QUEUE: http://localstack:4566/000000000000/email-service-crm-cleanup-queue
  OVERRIDE_EMAIL_CRM_POPULATION_QUEUE: http://localstack:4566/000000000000/email-service-crm-population-queue.fifo
  CHAT_DELETE_QUEUE: delete-chat-handler-queue
  CONTACTS_QUEUE: contacts-queue
  CONVERT_QUEUE: convert-service-queue
  DOCUMENT_DELETE_QUEUE: delete-document-handler-queue
  DOCUMENT_UPLOAD_FINALIZER_QUEUE_URL: http://localstack:4566/000000000000/document-upload-finalizer-queue
  DOCUMENT_TEXT_EXTRACTOR_QUEUE: document-text-extractor-lambda-queue
  EMAIL_SCHEDULED_QUEUE: email-service-scheduled-queue
  GMAIL_INBOX_SYNC_QUEUE: email-service-gmail-inbox-sync-queue
  GMAIL_INBOX_SYNC_RETRY_QUEUE: email-service-gmail-inbox-retry-queue
  GMAIL_OPS_QUEUE: email-service-gmail-ops-queue
  GMAIL_OPS_RETRY_QUEUE: email-service-gmail-ops-retry-queue
  LINK_MANAGER_QUEUE: email-service-refresh-queue
  OVERRIDE_LINK_MAINTENANCE_QUEUE: http://localstack:4566/000000000000/email-service-link-maintenance-queue
  SEARCH_EVENT_QUEUE: search-event-queue
  SFS_DELETE_QUEUE: email-sfs-delete-queue
  SFS_UPLOADER_QUEUE: email-service-sfs-mapper-queue
  STATIC_FILE_SERVICE_S3_EVENT_QUEUE_URL: http://localstack:4566/000000000000/static-file-s3-event-notification-queue
  OVERRIDE_REMINDER_DISPATCH_QUEUE: http://localstack:4566/000000000000/reminder-dispatch-queue
  OVERRIDE_CALENDAR_REMINDER_DISPATCH_QUEUE: http://localstack:4566/000000000000/calendar-reminder-dispatch-queue
  OVERRIDE_CALENDAR_SERVICE_BACKFILL_QUEUE: http://localstack:4566/000000000000/calendar-service-backfill-queue
  OVERRIDE_SLACK_IMPORT_QUEUE: http://localstack:4566/000000000000/slack-import-queue
  OVERRIDE_SLACK_IMPORT_DLQ: http://localstack:4566/000000000000/slack-import-dlq
  ENABLE_EMAIL_SCHEDULED_QUEUE: "true"
  ENABLE_GMAIL_OPS_QUEUE: "true"
  CURSOR_API_KEY_KMS_KEY_ID: alias/macro-local-cursor-api-key
  CODEX_OAUTH_KMS_KEY_ID: alias/macro-local-codex-oauth
  MCP_OAUTH_KMS_KEY_ID: alias/macro-local-mcp-oauth

  # Feature switches. Calendar and Gmail batching ship dark in deployed
  # environments; a stack that runs producers and workers from one build keeps
  # them on, as the local stack does.
  CALENDAR_SYNC_ENABLED: "true"
  CALENDAR_SCOPE_ENABLED: "true"
  CALENDAR_SEARCH_ENABLED: "true"
  GMAIL_LABEL_WRITE_BATCHES_ENABLED: "true"
  SLACK_IMPORT_ENABLED: "false"
  SLACK_IMPORT_CONCURRENCY: "1"

  # Third-party integrations. The configuration loaders require a value for
  # each of these at startup; the placeholders only satisfy them. A feature that
  # calls the provider (Stripe billing, GitHub sync, LLM chat, push, ...) needs a
  # real key here and does not work without one.
  POSTHOG_API_KEY: local-posthog-project-key
  POSTHOG_FEATURE_FLAGS_SECURE_API_KEY: local-posthog-feature-flags-key
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client}
  GOOGLE_CLIENT_SECRET_KEY: ${GOOGLE_CLIENT_SECRET:-local-google-client-secret}
  GITHUB_CLIENT_ID: local-github-client
  GITHUB_CLIENT_SECRET: local-github-client-secret
  GITHUB_IDP_ID: 99999999-9999-4999-8999-999999999999
  GITHUB_SYNC_APP_CLIENT_ID: local-github-sync-client
  GITHUB_SYNC_APP_CLIENT_SECRET: local-github-sync-secret
  GITHUB_SYNC_APP_PEM_SECRET_KEY: local-github-sync-pem
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-local-stripe-secret}
  STRIPE_PRICE_ID: price_local
  STRIPE_COMPUTER_STANDARD_MONTHLY_PRICE_ID: price_local_computer_standard_monthly
  STRIPE_COMPUTER_LARGE_MONTHLY_PRICE_ID: price_local_computer_large_monthly
  STRIPE_COMPUTER_XL_MONTHLY_PRICE_ID: price_local_computer_xl_monthly
  STRIPE_COMPUTER_STANDARD_YEARLY_PRICE_ID: price_local_computer_standard_yearly
  STRIPE_COMPUTER_LARGE_YEARLY_PRICE_ID: price_local_computer_large_yearly
  STRIPE_COMPUTER_XL_YEARLY_PRICE_ID: price_local_computer_xl_yearly
  AI_USAGE_FREE_INCLUDED_ALLOWANCE_CENTS: "500"
  AI_USAGE_INCLUDED_ALLOWANCE_CENTS: "1500"
  AI_USAGE_MAX_INCLUDED_ALLOWANCE_CENTS: "15000"
  AI_USAGE_OVERAGE_MARKUP_PERCENT: "25"
  GMAIL_GCP_QUEUE: gmail-gcp-queue-local
  APPLE_BUNDLE_ID: com.macro.local
  SNS_APNS_PLATFORM_ARN: arn:aws:sns:us-east-1:000000000000:app/APNS/macro-local
  SNS_FCM_PLATFORM_ARN: arn:aws:sns:us-east-1:000000000000:app/GCM/macro-local
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-local-anthropic-key}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-local-openai-key}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-local-google-generative-ai-key}
  FIREWORK_API_KEY: local-firework-key
  CEREBRAS_API_KEY: local-cerebras-key
  COHERE_API_KEY: local-cohere-key
  CAPSOLVER_API_KEY: ""
  OPENAI_DOMAIN_VERIFICATION_TOKEN: local-openai-domain-verification-token
  # Pipedream is a hosted third-party broker; with these blank the harness runs
  # without it (the connectors catalog is then empty). Fill all three to use it.
  PIPEDREAM_CLIENT_ID: ${PIPEDREAM_CLIENT_ID:-}
  PIPEDREAM_CLIENT_SECRET: ${PIPEDREAM_CLIENT_SECRET:-}
  PIPEDREAM_PROJECT_ID: ${PIPEDREAM_PROJECT_ID:-}
  # Instance-wide vendor tokens for the Linear and Notion importers, which
  # otherwise read those APIs through Pipedream. Blank = off.
  LINEAR_API_KEY: ${LINEAR_API_KEY:-}
  NOTION_API_TOKEN: ${NOTION_API_TOKEN:-}
  SLACK_MCP_CLIENT_ID: local-slack-mcp-client
  SLACK_MCP_CLIENT_SECRET: local-slack-mcp-secret
  # Video calls. These point at the `livekit` service when the `calls` profile
  # is on (see .env.example); otherwise they are placeholders.
  LIVEKIT_SERVER_URL: ${LIVEKIT_SERVER_URL:-http://localhost:7880}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-local-livekit-key}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-local-livekit-secret}
  CAL_EVENT_TYPE_CONTENT_NAMES_KEY: '{"1":{"content_name":"local","value":0}}'
  META_PIXEL_ID: local-meta-pixel
  META_ACCESS_TOKEN: local-meta-access-token
  HARNESS_BOT_ID: 00000000-0000-0000-0000-00000000a9e7
  MAX_REPO_SIZE_BYTES: "524288000"
  PUSHES_PER_MINUTE: "30"
  REPO_STORAGE_ROOT: /data/agent-git
  # Agent sandboxes: this stack has no Docker socket mount and no Daytona
  # account, so coder-bot sessions have nowhere to run. The in-process assistant

# Builds the images docker/selfhost/docker-compose.yml runs and publishes them
# to GitHub Container Registry as ghcr.io/<owner>/macro-<image>.
#
# Unlike most workflows here this one is written by hand, not generated by
# `cargo x workflows`, and runs on GitHub-hosted runners so a fork can run it
# without Namespace. The owner is taken from the repository, so the same file
# publishes to ghcr.io/macro-inc/* upstream and to a fork's own namespace.
#
# Run it from the Actions tab (workflow_dispatch) or by pushing a `selfhost-*`
# or `v*` tag. Each image is built natively per architecture and the digests are
# merged into one multi-arch tag.
name: Publish self-host images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (besides sha-<commit>)
        required: true
        default: latest
        type: string
      platforms:
        description: Architectures to build
        required: true
        default: linux/amd64,linux/arm64
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
  push:
    tags:
      - selfhost-*
      - v*

permissions:
  contents: read

concurrency:
  group: publish-selfhost-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      tag: ${{ steps.vars.outputs.tag }}
      matrix: ${{ steps.vars.outputs.matrix }}
      images: ${{ steps.vars.outputs.images }}
    steps:
      - id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            platforms="$INPUT_PLATFORMS"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            platforms="linux/amd64,linux/arm64"
          fi

          images='[
            {"image":"macro-services","dockerfile":"docker/Dockerfile.selfhost","context":".","build_args":"CARGO_BUILD_JOBS=2"},
            {"image":"macro-bootstrap","dockerfile":"docker/Dockerfile.selfhost-bootstrap","context":"."},
            {"image":"macro-web","dockerfile":"docker/Dockerfile.selfhost-web","context":"."},
            {"image":"macro-sync-service","dockerfile":"docker/sync-service.Dockerfile","context":"."},
            {"image":"macro-lexical-service","dockerfile":"docker/lexical-service.Dockerfile","context":"."},
            {"image":"macro-websocket-service","dockerfile":"docker/websocket-service.Dockerfile","context":"."},
            {"image":"macro-opensearch","dockerfile":"infra/local/opensearch/Dockerfile","context":"infra/local/opensearch"}
          ]'
          echo "images=$(jq -c '[.[].image]' <<<"$images")" >> "$GITHUB_OUTPUT"

          # One build per image and architecture, each on a runner of its own
          # architecture: emulating a Rust release build is impractically slow.
          matrix="$(jq -c --arg platforms "$platforms" '
            [ .[] as $i
              | ($platforms | split(",")[]) as $p
              | $i + { platform: $p,
                       runner: (if $p == "linux/arm64" then "ubuntu-24.04-arm" else "ubuntu-24.04" end),
                       suffix: ($p | sub("linux/"; "")) } ]' <<<"$images")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.suffix }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Free disk space
        # A Rust workspace build and its caches do not fit in the runner's free
        # disk next to the preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Add swap
        # A runner may already have /swapfile active, so this adds its own file;
        # the build still runs, only less safely, if swap cannot be added.
        continue-on-error: true
        # The Rust release build of the services peaks above the runner's 16 GB
        # when several large crates compile at once, and the runner is then
        # shut down. Swap, plus CARGO_BUILD_JOBS=2 for that image, avoids it.
        run: |
          sudo fallocate -l 8G /swapfile.macro
          sudo chmod 600 /swapfile.macro
          sudo mkswap /swapfile.macro
          sudo swapon /swapfile.macro
          free -h

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build_args }}
          # Pushed by digest; the merge job below gives the digests their tags.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.plan.outputs.owner }}/${{ matrix.image }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:sha-${SHA::12}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
